name: GHP-3 Web QA Kit

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/web-qa-kit/**'
      - '.github/workflows/qa-web-qa-kit.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    name: Browser QA fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qa/web-qa-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned Playwright dependency
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Unit QA
        run: npm run test:unit
      - name: Browser smoke QA against local fixtures only
        run: npm run test:browser
      - name: Preserve fixture reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghp3-web-qa-kit-fixtures
          path: qa/web-qa-kit/reports/
          if-no-files-found: warn
          retention-days: 7
